services:
  app:
    build: .
    container_name: LaravelApp
    network_mode: "host"
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"

  frontend:
    image: node:26.2.0
    # container_name: .
    network_mode: "host"
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"